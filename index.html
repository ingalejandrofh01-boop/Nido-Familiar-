<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nido · App familiar</title>
  <meta name="description" content="La app de nuestra familia: intercambios, cumpleaños, calendario, fotos y más.">
  <meta name="theme-color" content="#0d2352">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nido">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;700&family=Mountains+of+Christmas:wght@700&family=Creepster&family=Sancreek&family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=24">
</head>
<body data-mode="dark">
  <!-- Fondo inmersivo -->
  <div id="scene" aria-hidden="true">
    <div class="scene-svg"></div>
    <div class="scene-photo"></div>
    <div class="scene-shade"></div>
    <div class="scene-deco"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- App -->
  <div id="app">
    <div class="boot">
      <div class="boot-nest"><span class="egg e1"></span><span class="egg e2"></span><span class="egg e3"></span><span class="bird">🐣</span><span class="nest">🪺</span></div>
      <div class="boot-name">Nido</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-skel"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=24"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
    }
  </script>
</body>
</html>
